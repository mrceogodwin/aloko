name: Database migration validation

on:
  push:
    branches: [main]
    paths:
      - "database/migrations/**"
      - ".github/workflows/database-migrations.yml"
  pull_request:
    branches: [main]
    paths:
      - "database/migrations/**"
      - ".github/workflows/database-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aloko_test
          POSTGRES_PASSWORD: aloko_test
          POSTGRES_DB: aloko_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aloko_test -d aloko_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: aloko_test
      PGPASSWORD: aloko_test
      PGDATABASE: aloko_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply every migration in filename order to disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          for migration in database/migrations/*.sql; do
            echo "::group::Applying ${migration}"
            psql --set ON_ERROR_STOP=1 --file="${migration}"
            echo "::endgroup::"
          done
      - name: Verify the complete marketplace schema
        run: |
          psql --set ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            required_table text;
          BEGIN
            FOREACH required_table IN ARRAY ARRAY[
              'profiles',
              'listings',
              'listing_images',
              'staff_memberships',
              'platform_settings',
              'buyer_preferences',
              'seller_stores',
              'verification_applications',
              'marketplace_transactions',
              'service_provider_profiles',
              'service_provider_availability',
              'service_provider_availability_exceptions'
            ] LOOP
              IF to_regclass(format('public.%I', required_table)) IS NULL THEN
                RAISE EXCEPTION 'Required table public.% is missing', required_table;
              END IF;
            END LOOP;

            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
              WHERE schemaname = 'public'
                AND indexname = 'credit_ledger_one_intro_grant_per_seller'
            ) THEN
              RAISE EXCEPTION 'Introductory credit idempotency index is missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'profiles'
                AND column_name = 'account_type_selected_at'
            ) THEN
              RAISE EXCEPTION 'Account type onboarding completion column is missing';
            END IF;
          END
          $$;
          SQL
